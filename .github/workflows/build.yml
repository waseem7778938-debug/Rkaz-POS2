name: Build Rkaz POS EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '18'
    - run: npm install
    - run: npx pkg . --targets node18-win-x64 --output rkaz-pos.exe
    - uses: actions/upload-artifact@v4
      with:
        name: Rkaz-POS-App
        path: rkaz-pos.exe
