name: Build Rkaz-POS Executable

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Compile to EXE
      run: npx pkg server.js --target node18-win-x64 --output Rkaz-POS.exe

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Rkaz-POS-App
        path: Rkaz-POS.exe
